services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5442:5432"
    environment:
      POSTGRES_DB: breakdown
      POSTGRES_USER: breakdown
      POSTGRES_PASSWORD: breakdown
    volumes:
      - breakdown-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U breakdown -d breakdown"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  breakdown-pgdata:
